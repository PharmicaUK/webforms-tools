name: Release

# Push a tag v<version> (the version in src/WebForms.Cli/WebForms.Cli.csproj, editors/vscode/package.json and
# editors/claude-code/.claude-plugin/plugin.json) to build, test and attach the tool package (.nupkg) and the VS Code
# extension (.vsix) to a GitHub Release.
#
# Publishing to nuget.org is a separate, manual step: run this workflow from the Actions tab ("Run workflow") with
# the tag. It pushes that release's .nupkg with NuGet trusted publishing: no stored API key, NuGet/login exchanges
# the job's GitHub OIDC token for a short-lived one. Setup: a trusted publishing policy on nuget.org (owner
# PharmicaUK, repository webforms-tools, workflow release.yml, environment nuget), the secret NUGET_USER (the
# nuget.org account name) and the environment "nuget" (add required reviewers there to gate it).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish to nuget.org (e.g. v0.8.1)
        required: true

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - name: Check versions match the tag
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'.TrimStart('v')
          $cli = ([xml](Get-Content src/WebForms.Cli/WebForms.Cli.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          $vscode = (Get-Content editors/vscode/package.json -Raw | ConvertFrom-Json).version
          $plugin = (Get-Content editors/claude-code/.claude-plugin/plugin.json -Raw | ConvertFrom-Json).version
          "tag $tag, tool $cli, vscode $vscode, plugin $plugin"
          if ($cli -ne $tag -or $vscode -ne $tag -or $plugin -ne $tag) { throw "Version mismatch" }

      - name: Build
        run: dotnet build -c Release

      - name: Test
        run: dotnet test tests/WebForms.Tests -c Release --no-build

      - name: Pack
        # Not --no-build: packing builds the ReadyToRun win-x64 variant (see WebForms.Cli.csproj).
        run: dotnet pack src/WebForms.Cli -c Release

      - name: Package the VS Code extension
        working-directory: editors/vscode
        run: |
          npm ci
          npm run package

      - name: Create the GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = @(Get-ChildItem artifacts/nupkg/*.nupkg) + @(Get-ChildItem artifacts/vsix/*.vsix) | ForEach-Object FullName
          gh release create '${{ github.ref_name }}' $files --title '${{ github.ref_name }}' --generate-notes --verify-tag

  nuget:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    environment:
      name: nuget
      url: https://www.nuget.org/packages/Pharmica.WebForms.Tools
    permissions:
      contents: read
      # Trusted publishing: NuGet/login swaps the OIDC token for a short-lived API key.
      id-token: write
    steps:
      - name: Download the release's package
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download '${{ inputs.tag }}' --repo '${{ github.repository }}' --pattern '*.nupkg' --dir nupkg

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: NuGet login (OIDC -> temporary API key)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push (Get-ChildItem nupkg/*.nupkg).FullName --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
